name: PRBar

options:
  bundleIdPrefix: dev.lustefaniak
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Already in the graph as MarkdownUI's dependency; declared explicitly so
  # AuthorAvatar can use its in-memory image cache.
  NetworkImage:
    url: https://github.com/gonzalezreal/NetworkImage
    from: "6.0.0"
  # prbar.yaml, shared with the CLI (Package.swift declares it too).
  Yams:
    url: https://github.com/jpsim/Yams
    from: "6.2.2"
  # The rules engine (Package.swift pins the same commit).
  cel-swift:
    url: https://github.com/lustefaniak/cel-swift
    revision: cded182490b9aa36d55051c4519b2e238ec46f23

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  PRBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/PRBar
      # The platform-independent half, also built alone by Package.swift
      # (and on Linux in CI). Compiled into the same module as the app.
      - path: Sources/PRBarCore
        excludes:
          # Prompts and the schema are compiled in from
          # EmbeddedResources.swift (bin/gen-resources). CLI/ is the
          # headless entry point, built only by SwiftPM.
          - Resources/**
          - CLI/**
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - package: NetworkImage
      - package: Sparkle
      - package: Yams
      - package: cel-swift
        product: CEL
      - package: cel-swift
        product: CELPolicy
      - package: cel-swift
        product: CELSwift
      # The CLI / server, shipped inside the app as
      # Contents/MacOS/prbar-review so it is signed, notarized and updated
      # with it. Settings → "Install command-line tool" symlinks it.
      - target: prbar-review
        embed: true
        codeSign: true
        copy:
          destination: executables
    # Custom Info.plist — Sparkle keys (SUFeedURL / SUPublicEDKey / SUEnableInstallerLauncherService)
    # are not in Apple's INFOPLIST_KEY_* allow-list, so GENERATE_INFOPLIST_FILE silently drops them.
    # Generating a real plist via XcodeGen is the only way to embed them.
    info:
      path: Resources/PRBar-Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: PRBar
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        NSHumanReadableCopyright: "Copyright Lukasz Stefaniak"
        # Sparkle auto-update. Feed lives on the gh-pages branch
        # (published by .github/workflows/release.yml on each tag).
        # The public EdDSA key is generated once via `bin/sparkle-keygen`
        # — the matching private key stays in the macOS Keychain
        # locally and in the SPARKLE_ED_PRIVATE_KEY GitHub secret on CI.
        SUFeedURL: "https://lustefaniak.github.io/prbar/appcast.xml"
        SUPublicEDKey: "K1o93vv5SuisDDP+LIRbLJddFf3PXpa3JoiKTnl2Jh4="
        SUEnableInstallerLauncherService: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lustefaniak.prbar
        PRODUCT_NAME: PRBar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug builds stay ad-hoc signed for fast local iteration.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        # Release builds enable hardened runtime + secure timestamp,
        # which are non-negotiable for Apple notarization. The actual
        # Developer ID identity / DEVELOPMENT_TEAM are injected by
        # bin/release-dmg from env so project.yml stays portable.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_ENTITLEMENTS: Resources/PRBar.entitlements

  # The same binary SwiftPM builds as `prbar-review`, built here from the
  # same sources so the app can carry it. PRBarCore is compiled into this
  # module (no framework), which is why main.swift guards its import.
  prbar-review:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PRBarCore
        excludes:
          - Resources/**
      - path: Sources/prbar-review
    dependencies:
      - package: Yams
      - package: cel-swift
        product: CEL
      - package: cel-swift
        product: CELPolicy
      - package: cel-swift
        product: CELSwift
    settings:
      base:
        PRODUCT_NAME: prbar-review
        PRODUCT_BUNDLE_IDENTIFIER: dev.lustefaniak.prbar.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Only ever installed inside the app; without this an archive
        # also exports it as a product of its own.
        SKIP_INSTALL: YES
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  PRBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PRBarTests
    dependencies:
      - target: PRBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lustefaniak.prbar.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PRBar:
    build:
      targets:
        PRBar: all
        PRBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PRBarTests
    profile:
      config: Release
    archive:
      config: Release
