name: ci

on:
  push:
    branches: [main]
    # Doc-only direct-to-main pushes (the admin-override escape hatch
    # described in CLAUDE.md) don't need CI. PRs still always run CI
    # regardless of paths so a doc-only PR's required check still
    # reports — no merge-block surprise.
    paths-ignore:
      - CLAUDE.md
      - README.md
      - docs/**
  pull_request:

# Cancel any in-flight CI run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    # Well under GitHub's 360-minute default: a hung test should fail the
    # run in minutes, not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # bin/version uses git describe + rev-list count; the shallow
          # clone GitHub uses by default would skew the build number.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build (Debug)
        run: ./bin/build

      # Package the .app as a single zip so the bundle's structure,
      # symlinks, and permissions survive the artifact round-trip
      # (upload-artifact re-zips a raw directory and mangles bundles).
      # Uploaded before Test so a red test run still leaves a downloadable
      # build. The app is ad-hoc-signed (no Developer ID) — Gatekeeper
      # quarantines it on download; right-click -> Open, or run
      # `xattr -dr com.apple.quarantine PRBar.app` after unzipping.
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Debug/PRBar.app PRBar-debug.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: PRBar-debug-app
          path: PRBar-debug.app.zip
          if-no-files-found: error

      - name: Test
        run: ./bin/test

  # The headless review CLI is the half of PRBar that has to run where
  # there is no menu bar, so it gets built and tested on the platform it
  # actually ships to rather than only compiled on macOS.
  linux-cli:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Build release binary
        run: swift build -c release --static-swift-stdlib --product prbar-review

      # Prompts and the output schema are compiled in, so the binary is
      # the whole install. Running it from an empty directory proves no
      # resource bundle is needed beside it.
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp .build/release/prbar-review dist/
          (cd /tmp && "$GITHUB_WORKSPACE/dist/prbar-review" --help 2>&1 | grep -q usage)
          tar -C dist -czf prbar-review-linux-amd64.tar.gz .

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: prbar-review-linux-amd64
          path: prbar-review-linux-amd64.tar.gz
          if-no-files-found: error
