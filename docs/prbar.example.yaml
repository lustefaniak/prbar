# Example prbar.yaml. The menu-bar app and the prbar-review CLI read the
# same file, by default ~/.config/prbar/prbar.yaml (override with
# $PRBAR_CONFIG). JSON is valid YAML, so a prbar.json works too.
#
# Every key is optional; an empty file means the shipped defaults, which
# review PRs and post nothing. What differs per repository is set by
# `configure` rules in rules/ beside this file (see
# docs/rules.example/configure/10-repos.yaml); what they don't set comes
# from `defaults`, then the shipped default. Details: docs/configuration.md.
version: 1

# auto | claude | codex. auto picks claude when installed, else codex.
defaultProvider: claude
# Omit to use PRBar's default (sonnet); "" passes no --model at all.
defaultClaudeModel: sonnet
defaultClaudeEffort: ""

# App-level review settings. A missing key means PRBar's shipped default.
defaults:
  toolMode: sandboxed
  splitMode: perSubfolder
  maxParallelSubreviews: 2
  maxCostUsdPerSubreview: 3.0
  maxToolCallsPerSubreview: 10
  reviewTimeoutSeconds: 600

  reviewDrafts: false
  skipAIIfReviewedByOthers: true
  # Configure rules add to this list; negate a pattern there to opt out.
  excludeTitlePatterns:
    - "chore: bump *"
    - "Release *"

  # off | warnings_and_blockers | all_findings
  shareFindings: warnings_and_blockers
  shareMinConfidence: 0.5
  shareMaxComments: 20

  autoApprove:
    enabled: false
  autoDeny:
    action: "off"
  resolveThreads:
    enabled: false

# Which repositories PRBar handles. Globs, later ones winning, `!` excluding.
repositories:
  # Review requests PRBar triages; leave out for every repository.
  triage: ["acme/*", "me/*"]
  # Never shown in PRBar at all.
  hide: ["*/infra-*"]
  # Whose own .prbar/rules are read, at their default branch. They decide
  # what is posted under your name.
  trustRules: ["acme/monorepo"]

# What coding agents may do through `prbar-review mcp`: off, allow or ask.
# Anything else turns the capability off.
agents:
  review: allow
  post: "off"
  rules: ask
