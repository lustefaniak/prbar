# Example prbar.yaml. The menu-bar app and the prbar-review CLI read the
# same file, by default ~/.config/prbar/prbar.yaml (override with
# $PRBAR_CONFIG). JSON is valid YAML, so a prbar.json works too.
#
# Every key is optional; an empty file means the shipped defaults, which
# review PRs and post nothing. How values combine (repo rule, then
# `defaults`, then the shipped default; a key present in a repo rule is an
# override, a missing one inherits) is explained in docs/configuration.md.
version: 1

# auto | claude | codex. auto picks claude when installed, else codex.
defaultProvider: claude
# Omit to use PRBar's default (sonnet); "" passes no --model at all.
defaultClaudeModel: sonnet
defaultClaudeEffort: ""

# App-level review settings. A missing key means PRBar's shipped default.
defaults:
  toolMode: sandboxed
  splitMode: perSubfolder
  maxParallelSubreviews: 2
  maxCostUsdPerSubreview: 3.0
  maxToolCallsPerSubreview: 10
  reviewTimeoutSeconds: 600

  reviewDrafts: false
  skipAIIfReviewedByOthers: true
  # Repo rules add to this list; negate a pattern there to opt out.
  excludeTitlePatterns:
    - "chore: bump *"
    - "Release *"

  # off | warnings_and_blockers | all_findings
  shareFindings: warnings_and_blockers
  shareMinConfidence: 0.5
  shareMaxComments: 20

  autoApprove:
    enabled: false
  autoDeny:
    action: "off"
  resolveThreads:
    enabled: false

# First matching rule wins. A key present here overrides `defaults` for that
# repo; leave it out to inherit. autoApprove / autoDeny / resolveThreads
# override as a whole block: fields missing inside a block take the shipped
# values, not the ones in `defaults`.
repos:
  - repoGlobs: ["getsynq/cloud"]
    rootPatterns: ["kernel-*", "lib/*", "dev-tools"]
    providerOverride: codex
    collapseAboveSubreviewCount: 8
    shareFindings: all_findings

  - repoGlobs: ["*/infra-*"]
    excluded: true
